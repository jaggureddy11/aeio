name: Windows Build & Test Verification

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-verify:
    name: Windows Verification (Unsigned)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Fetch and Verify Semantic Models (PowerShell)
        shell: pwsh
        run: .\scripts\fetch-models.ps1

      - name: Verify Model Presence on Windows Filesystem
        shell: pwsh
        run: |
          Write-Host "=== Verifying Local Models Directory ==="
          Get-ChildItem -Path src-tauri\resources\models -Recurse | Where-Object { -not $_.PSIsContainer } | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Run Full Backend Test Suite on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Build Unsigned Production Bundle (NSIS & MSI)
        run: npm run tauri build

      - name: Inspect Windows Bundle Outputs & Sizes
        shell: pwsh
        run: |
          Write-Host "=== Inspecting Target Release Bundle ==="
          Get-ChildItem -Path src-tauri\target\release\bundle -Recurse | Where-Object { -not $_.PSIsContainer } | Select-Object FullName, Length | Format-Table -AutoSize
          
          Write-Host "=== Checking Model Files Inside Installed Assets ==="
          $models = Get-ChildItem -Path src-tauri\target\release -Filter "model.safetensors" -Recurse
          if ($models) {
              Write-Host "Confirmed model.safetensors packaged in build:"
              $models | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
              Write-Warning "model.safetensors check in target root"
          }

      - name: Upload Windows Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-bundles
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
