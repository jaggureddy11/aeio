[package]
name = "aeio"
version = "0.1.0"
description = "Aeio - Local-First Desktop AI Assistant"
authors = ["aeio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "aeio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled-full"] }
tauri-plugin-global-shortcut = "2.3.2"
uuid = { version = "1.26.1", features = ["v4"] }
chrono = "0.4.45"
arboard = "3.6.1"
keyring = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
